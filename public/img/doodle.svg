<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" fill="none">
  <!-- { brace shape -->
  <path d="M20 30 Q14 30 14 24 L14 18 Q14 10 8 10 Q14 10 14 4 L14 -2 Q14 -8 20 -8" stroke="#333" stroke-width="2" fill="none"/>

  <!-- /> arrow -->
  <polyline points="80,20 90,28 80,36" stroke="#333" stroke-width="2" fill="none"/>
  <line x1="93" y1="20" x2="88" y2="36" stroke="#333" stroke-width="2"/>

  <!-- () parens -->
  <path d="M130 18 Q124 26 124 34 Q124 42 130 50" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M138 18 Q144 26 144 34 Q144 42 138 50" stroke="#333" stroke-width="2" fill="none"/>

  <!-- // double slash -->
  <line x1="170" y1="15" x2="162" y2="45" stroke="#333" stroke-width="2"/>
  <line x1="180" y1="15" x2="172" y2="45" stroke="#333" stroke-width="2"/>

  <!-- semicolon -->
  <circle cx="50" cy="75" r="2.5" fill="#333"/>
  <path d="M50 82 Q50 88 46 92" stroke="#333" stroke-width="2" fill="none"/>

  <!-- star / asterisk -->
  <line x1="100" y1="68" x2="100" y2="84" stroke="#333" stroke-width="2"/>
  <line x1="92" y1="72" x2="108" y2="80" stroke="#333" stroke-width="2"/>
  <line x1="108" y1="72" x2="92" y2="80" stroke="#333" stroke-width="2"/>

  <!-- dots scattered -->
  <circle cx="160" cy="80" r="3" fill="#333"/>
  <circle cx="30" cy="120" r="2.5" fill="#333"/>
  <circle cx="185" cy="130" r="3" fill="#333"/>
  <circle cx="70" cy="160" r="2.5" fill="#333"/>
  <circle cx="145" cy="170" r="3" fill="#333"/>

  <!-- < > angle brackets -->
  <polyline points="20,105 10,115 20,125" stroke="#333" stroke-width="2" fill="none"/>
  <polyline points="35,105 45,115 35,125" stroke="#333" stroke-width="2" fill="none"/>

  <!-- underscore / dash line -->
  <line x1="80" y1="130" x2="110" y2="130" stroke="#333" stroke-width="2"/>

  <!-- hash # shape -->
  <line x1="155" y1="100" x2="155" y2="125" stroke="#333" stroke-width="1.5"/>
  <line x1="163" y1="100" x2="163" y2="125" stroke="#333" stroke-width="1.5"/>
  <line x1="150" y1="108" x2="168" y2="108" stroke="#333" stroke-width="1.5"/>
  <line x1="150" y1="117" x2="168" y2="117" stroke="#333" stroke-width="1.5"/>

  <!-- squiggle -->
  <path d="M10 160 Q20 153 30 160 Q40 167 50 160" stroke="#333" stroke-width="2" fill="none"/>

  <!-- small diamond -->
  <polygon points="110,155 117,163 110,171 103,163" stroke="#333" stroke-width="1.5" fill="none"/>

  <!-- arrow -->
  <line x1="130" y1="148" x2="155" y2="148" stroke="#333" stroke-width="2"/>
  <polyline points="149,142 155,148 149,154" stroke="#333" stroke-width="2" fill="none"/>
</svg>
